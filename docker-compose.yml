services:
  client:
    image: "dimitarzhechev/multi-client:latest"
    mem_limit: 128m
    restart: always
  api:
    image: "dimitarzhechev/multi-server:latest"
    mem_limit: 128m
    restart: always
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - PGUSER=$PGUSER
      - PGHOST=$PGHOST
      - PGDATABASE=$PGDATABASE
      - PGPASSWORD=$PGPASSWORD
      - PGPORT=$PGPORT
  worker:
    image: "dimitarzhechev/multi-worker:latest"
    mem_limit: 128m
    restart: always
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
  nginx:
    image: "dimitarzhechev/multi-nginx:latest"
    mem_limit: 128m
    restart: always
    depends_on:
      - client
      - api
    ports:
      - "80:80"